name: Offline compiler tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m evidence_test_workbench demo --output demo-output
      - run: python -m pip install .
      - run: evidence-test-workbench --help
      - name: Verify installed package data outside source checkout
        run: python -c "import pathlib, subprocess, sys, tempfile; temp = tempfile.TemporaryDirectory(); subprocess.run([sys.executable, '-m', 'evidence_test_workbench', 'demo', '--output', str(pathlib.Path(temp.name) / 'installed-demo')], cwd=temp.name, check=True); temp.cleanup()"
      - run: python tools/package_skill.py --output dist/evidence-case-design.zip
